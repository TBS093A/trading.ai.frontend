server {
    # Non-privileged port - the container runs as a non-root UID (k8s manifest sets
    # runAsUser/drop ALL capabilities), which can't bind <1024 without NET_BIND_SERVICE.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers - added 2026-09-25 after OWASP ZAP baseline (DAST) flagged these as
    # missing. Deliberately NOT adding Cross-Origin-Embedder-Policy: require-corp here - this app
    # loads Google Fonts cross-origin (public/index.html), and COEP would block that unless
    # Google's font CDN sends a matching Cross-Origin-Resource-Policy header, which isn't
    # guaranteed - a functional regression is worse than one unaddressed low-severity DAST
    # warning. Same reasoning for Subresource Integrity on the Google Fonts <link>: Google
    # explicitly advises against SRI there since the CSS response varies by User-Agent.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # connect-src covers the backend API this SPA actually calls (REACT_APP_API_URL, baked in at
    # build time - see Dockerfile). style-src/font-src allow the Google Fonts this app loads.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.00x097.com" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
