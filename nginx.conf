server {
    # Non-privileged port - the container runs as a non-root UID (k8s manifest sets
    # runAsUser/drop ALL capabilities), which can't bind <1024 without NET_BIND_SERVICE.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
